  .line{white-space:pre-wrap;word-break:break-word}

  .line.cmd .at{color:var(--dim)}
  .line.cmd .pa{color:var(--cyan)}

<script>
// Matrix rain boot animation
(function(){
  const boot = document.getElementById('bootMx');
  if(!boot) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ boot.remove(); return; }

  const canvas = document.getElementById('bootMxCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  size();

  const fontSize = 16 * dpr;
  const cols = Math.ceil(canvas.width / fontSize);
  const drops = new Array(cols).fill(0).map(() => Math.random() * -50);
  const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF{}[]<>$#@*+-=/\\';

  ctx.font = fontSize + "px 'JetBrains Mono', monospace";
  let raf;
  function frame(){
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for(let i = 0; i < cols; i++){
      const ch = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
      const x = i * fontSize;
      const y = drops[i] * fontSize;
      // head bright, trail dim
      ctx.fillStyle = '#9bff9b';
      ctx.fillText(ch, x, y);
      ctx.fillStyle = '#27c93f';
      ctx.fillText(ch, x, y - fontSize);
      drops[i]++;
      if(y > canvas.height && Math.random() > 0.975) drops[i] = 0;
    }
    raf = requestAnimationFrame(frame);
  }
  frame();

  document.documentElement.style.overflow = 'hidden';
  setTimeout(() => {
    boot.classList.add('fade');
    setTimeout(() => {
      cancelAnimationFrame(raf);
      boot.remove();
      document.documentElement.style.overflow = '';
    }, 420);
  }, 1500);
})();
</script>

<script>
(function(){
  const out = document.getElementById("termOutput");
  const input = document.getElementById("termInput");
  const form = document.getElementById("termForm");
  const chips = document.getElementById("chips");

  const STATE = {
    history: [],
    historyIndex: -1,
  };

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function print(html, cls){
    const line = el("div", "line " + (cls || ""), html);
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  function printPrompt(cmd){
    const html = `<span class="pl">kushar</span><span class="at">@</span><span class="pl">portfolio</span><span class="at">:</span><span class="pa">~</span><span class="at">$</span> <span class="input">${escapeHTML(cmd)}</span>`;
    print(html, "cmd");
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  // Command dispatch
  const COMMANDS = {};

  function execute(raw){
    const trimmed = raw.trim();
    printPrompt(raw);

    if (!trimmed) return;

    STATE.history.push(trimmed);
    if (STATE.history.length > 50) STATE.history.shift();
    STATE.historyIndex = STATE.history.length;

    const parts = trimmed.split(/\s+/);
    const cmd = parts[0];
    const args = parts.slice(1);

    const fn = COMMANDS[cmd];
    if (fn){
      try { fn(args); }
      catch(err){ print(`error: ${err.message || err}`, "err"); }
    } else {
      print(`bash: ${escapeHTML(cmd)}: command not found`, "err");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    execute(v);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp"){
      e.preventDefault();
      if (STATE.history.length === 0) return;
      STATE.historyIndex = Math.max(0, STATE.historyIndex - 1);
      input.value = STATE.history[STATE.historyIndex] || "";
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      if (STATE.history.length === 0) return;
      STATE.historyIndex = Math.min(STATE.history.length, STATE.historyIndex + 1);
      input.value = STATE.history[STATE.historyIndex] || "";
    } else if (e.key === "Tab"){
      e.preventDefault();
      const prefix = input.value;
      if (!prefix) return;
      const matches = Object.keys(COMMANDS).filter(c => c.startsWith(prefix));
      if (matches.length === 1) input.value = matches[0];
      else if (matches.length > 1){
        print(matches.join("  "), "out");
      }
    } else if (e.key === "l" && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      out.innerHTML = "";
    }
  });

    const c = e.target.closest(".chip");
    if (!c) return;
    const cmd = c.dataset.cmd;
    input.value = "";
    execute(cmd);
    input.focus();
